# Copy this file to a site-specific configuration and fill measured values.
# Nulls/confirmed:false deliberately prevent launching with an invented origin
# or an uncalibrated primary-LiDAR rotation.
system:
  localization_mode: ins_only
  pub_tf: false
output:
  map_frame: ins_enu
ins_only:
  topic_prefix: /cgi430
  # Device output is preserved; unknown WebUI settings must not imply rear axle.
  output_reference: device_output  # device_output or explicitly confirmed rear_axle
  output_reference_confirmed: false
  output_point_id: unverified_cgi_output
  output_frame: cgi_output_flu
  attitude_reference: device_output  # rear_body only when verified on the device
  use_sim_time: false
  receive_time_offset_sec: 0.0
  pose_interpolation_max_gap_sec: 0.05
  audit_root: runs
  georeference:
    confirmed: false
    datum: WGS84
    origin_llh: [null, null, null]  # latitude deg, longitude deg, ellipsoid height m
    input_height: null            # ellipsoidal or orthometric, verify device settings
    geoid_separation_m: null      # h = H + N; required only for orthometric input
    max_radius_m: 20000
  quality:
    # Engineering initial limits, not a certified accuracy guarantee.
    max_age_sec: 0.15
    max_skew_sec: 0.02
    max_future_sec: 0.02
    max_differential_age_sec: 2.0
    max_horizontal_sigma_m: 0.10
    max_vertical_sigma_m: 0.20
    max_attitude_sigma_deg: 0.5
    max_velocity_sigma_mps: 0.20
    recovery_samples: 10
cloud:
  enabled: false  # Only confirmed rear_axle/rear_body mode supports clouds.
  lidar_config: ../sany/localization.yaml
  rear_from_primary:
    confirmed: false
    translation_m: [null, null, null]
    quaternion_xyzw: [null, null, null, null]
  max_wait_sec: 0.3
  map_publish_every: 1
  voxel_leaf_m: 0.1
