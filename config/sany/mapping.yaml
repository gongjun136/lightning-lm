# SANY shared mapping parameters. Resolve VIN/LIDAR before starting C++ nodes.
# Use scripts/resolve_sany_config.py or the standard shell launchers.
sany_vehicle_config:
  calibrations: calibrations.yaml
common:
  dataset: sany
  lidar_topic: /livox/lidar_192_168_3_184
  livox_lidar_topic: ''
  imu_topic: /livox/imu_192_168_3_184
multi_lidar:
  enabled: true
  primary_lidar_id: 0
  frame_period: 0.1
  match_tolerance: 0.02
  reorder_window: 0.5
  min_lidars: 1
  online_extrinsic_estimation: false
  topics:
    lidar_0: /livox/lidar_192_168_3_184
    lidar_1: /livox/lidar_192_168_1_108
    lidar_2: /livox/lidar_192_168_2_133
    lidar_3: /livox/lidar_192_168_4_143
    imu_0: /livox/imu_192_168_3_184
    imu_1: /livox/imu_192_168_1_108
    imu_2: /livox/imu_192_168_2_133
    imu_3: /livox/imu_192_168_4_143
imu_initialization:
  initial_yaw_deg: 0.0
  min_duration: 2.0
  min_samples: 300
  max_mean_gyro_norm: 0.2
  max_gyro_std: 0.1
  max_acc_std: 0.5
  min_mean_acc_norm: 0.5
  max_mean_acc_norm: 1.5
lidar_noise_model:
  enabled: true
  range_sigma: 0.02
  angular_sigma_deg: 0.05
  reference_sigma: 0.05
  min_information_scale: 0.25
  max_information_scale: 4.0
self_point_filter:
  enabled: true
  front: 4.2218
  back: 4.4582
  left: 1.543
  right: 1.543
  bottom: 3.577
  top: 0.05
  padding: 0.1
output:
  map_frame: map
  lidar_frame: lidar_184
  primary_lidar_position_in_body:
  - 2.199
  - 0.0
  - 2.74
map_export:
  normalize_start_ground_z: true
  start_ground_search_radius: 10.0
  expected_sensor_height: 3.56
  expected_height_tolerance: 0.8
  histogram_bin_size: 0.05
  inlier_tolerance: 0.2
  max_median_absolute_deviation: 0.1
  min_ground_inliers: 100
  max_ground_tilt_deg: 10.0
  self_point_filter:
    enabled: true
    min_body:
    - 1.0
    - -4.8
    - -0.75
    max_body:
    - 5.4
    - 4.8
    - 1.0
    padding: 0.1
  export_pgm: true
  pgm_resolution: 0.05
  pgm_min_height: 3.5
  pgm_max_height: 4.0
  pgm_obstacle_dilation_radius: 0.0
  pgm_min_observation_frames: 3
fasterlio:
  lidar_type: 1
  scan_line: 4
  blind: 0.5
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 3
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  propagate_velocity: true
  lidar_update_pose_only: false
  lidar_update_inertial_states: true
  max_update_velocity_step: 0.5
  max_update_gyro_bias_step: 0.05
  max_update_acc_bias_step: 0.5
  max_update_gravity_step: 0.05
  acc_cov: 1.0
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T:
  - -0.011
  - -0.02329
  - 0.04412
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  keep_first_imu_estimation: false
  kf_dis_th: -1.0
  kf_angle_th: 0.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 300
  imu_filter: false
  proj_kfs: false
  livox_point_time_scale: 1.0e-09
roi:
  height_max: 100.0
  height_min: -100.0
system:
  with_ui: false
  with_loop_closing: true
  with_2dui: false
  with_g2p5: false
  step_on_kf: false
backend:
  mode: ba_btc_hba
  verbose: true
  local_ba:
    enabled: false
  btc:
    enabled: true
    descriptor_submap_size: 10
    descriptor_submap_stride: 2
    max_points_per_submap: 50000
    min_points_per_submap: 100
    downsample_leaf_size: 0.2
    refine_with_icp: true
    icp_max_iterations: 30
    icp_max_correspondence_distance: 5.0
    icp_max_fitness_score: 2.0
    icp_max_translation_correction: 10.0
    icp_batch_size: 8
    icp_workers: 8
    min_loop_score: 0.6
    max_drift_ratio: 0.005
    max_rotation_correction_deg: 45.0
    refine_with_plane_icp: true
    plane_icp_iterations: 20
    plane_icp_min_matches: 20
    plane_icp_min_observability: 3.0
    allow_degenerate_plane_icp: true
    degenerate_min_loop_score: 0.6
    degenerate_min_matches: 60
    confirmation_count: 2
    confirmation_max_current_gap: 10
    confirmation_max_history_gap: 10
    loop_cooldown_descriptors: 10
    max_odom_revisit_distance: 0.0
    min_optimization_translation: 0.2
    min_optimization_rotation_deg: 2.0
    descriptor:
      useful_corner_num: 200
      plane_merge_normal_threshold: 0.1
      plane_merge_distance_threshold: 0.3
      plane_detection_threshold: 0.01
      voxel_size: 1.0
      voxel_init_points: 10
      projection_plane_count: 2
      projection_resolution: 0.5
      projection_height_increment: 0.1
      projection_min_distance: 0.0
      projection_max_distance: 5.0
      summary_min_threshold: 10.0
      line_filter: 1
      touch_filter: 0
      descriptor_near_count: 15
      descriptor_min_length: 2.0
      descriptor_max_length: 50.0
      non_max_suppression_radius: 2.0
      triangle_side_resolution: 0.2
      skip_near_descriptors: 30
      candidate_count: 50
      verification_threads: 4
      rough_distance_threshold: 0.03
      similarity_threshold: 0.5
      internal_icp_threshold: 0.15
      normal_threshold: 0.2
      plane_distance_threshold: 0.5
  pose_graph:
    iterations: 20
    outlier_iterations: 10
    motion_translation_noise: 0.1
    motion_rotation_noise_deg: 3.0
    loop_translation_noise: 0.2
    loop_rotation_noise_deg: 3.0
    robust_kernel_delta: 1.0
    loop_outlier_chi2: 25.0
  hba:
    enabled: false
