# SANY shared localization parameters. Resolve VIN/LIDAR before starting C++ nodes.
# Use scripts/resolve_sany_config.py or the standard shell launchers.
sany_vehicle_config:
  calibrations: calibrations.yaml
common:
  dataset: sany
  lidar_topic: /livox/lidar_192_168_3_184
  livox_lidar_topic: ''
  imu_topic: /livox/imu_192_168_3_184
  benchmark_variant: relocalization_solid_cpu
compute_budget:
  lio_threads: 6
  ndt_threads: 4
  ndt_max_points: 3500
  solid_icp_workers: 12
  solid_worker_nice: 5
multi_lidar:
  enabled: true
  primary_lidar_id: 0
  frame_period: 0.1
  match_tolerance: 0.02
  reorder_window: 0.1
  min_lidars: 1
  adaptive_load:
    enabled: true
    tracking_min_lidars: 1
    relocalization_min_lidars: 1
    cloud_publish_min_lidars: 4
    cloud_publish_require_primary: true
    tracking_lidar_count: 0
    rotate_secondary_lidars: false
    lio_point_budgets:
    - 2200
    - 1804
    - 1500
    predictive: true
    target_latency_sec: 0.09
    hard_latency_sec: 0.3
    degrade_processing_ratio: 0.72
    recover_processing_ratio: 0.5
    degrade_consecutive_frames: 1
    recover_consecutive_frames: 75
    point_strides:
    - 1
    - 1
    - 1
  online_extrinsic_estimation: false
  topics:
    lidar_0: /livox/lidar_192_168_3_184
    lidar_1: /livox/lidar_192_168_1_108
    lidar_2: /livox/lidar_192_168_2_133
    lidar_3: /livox/lidar_192_168_4_143
    imu_0: /livox/imu_192_168_3_184
    imu_1: /livox/imu_192_168_1_108
    imu_2: /livox/imu_192_168_2_133
    imu_3: /livox/imu_192_168_4_143
imu_initialization:
  initial_yaw_deg: 0.0
  min_duration: 2.0
  min_samples: 300
  max_mean_gyro_norm: 0.2
  max_gyro_std: 0.1
  max_acc_std: 0.5
  min_mean_acc_norm: 0.5
  max_mean_acc_norm: 1.5
lidar_noise_model:
  enabled: true
  range_sigma: 0.02
  angular_sigma_deg: 0.05
  reference_sigma: 0.05
  min_information_scale: 0.25
  max_information_scale: 4.0
self_point_filter:
  enabled: true
  front: 4.2218
  back: 4.4582
  left: 1.543
  right: 1.543
  bottom: 3.577
  top: 0.05
  padding: 0.1
map_export:
  normalize_start_ground_z: true
  start_ground_search_radius: 10.0
  expected_sensor_height: 3.56
  expected_height_tolerance: 0.8
  histogram_bin_size: 0.05
  inlier_tolerance: 0.2
  max_median_absolute_deviation: 0.1
  min_ground_inliers: 100
  max_ground_tilt_deg: 10.0
  self_point_filter:
    enabled: true
    min_body:
    - 1.0
    - -4.8
    - -0.75
    max_body:
    - 5.4
    - 4.8
    - 1.0
    padding: 0.1
  export_pgm: true
  pgm_resolution: 0.05
  pgm_min_height: 3.5
  pgm_max_height: 4.0
  pgm_obstacle_dilation_radius: 0.0
  pgm_min_observation_frames: 3
fasterlio:
  lidar_type: 1
  scan_line: 4
  blind: 0.5
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 3
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  propagate_velocity: true
  lidar_update_pose_only: false
  lidar_update_inertial_states: true
  # A 0.1 m/s gate causes pose-only fallback and startup drift on the new vehicle.
  max_update_velocity_step: 0.5
  max_update_gyro_bias_step: 0.05
  max_update_acc_bias_step: 0.5
  max_update_gravity_step: 0.05
  acc_cov: 1.0
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T:
  - -0.011
  - -0.02329
  - 0.04412
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  keep_first_imu_estimation: false
  kf_dis_th: -1.0
  kf_angle_th: 0.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 300
  imu_filter: false
  proj_kfs: false
  livox_point_time_scale: 1.0e-09
roi:
  height_max: 100.0
  height_min: -100.0
system:
  with_ui: false
  with_loop_closing: true
  pub_tf: false
  online_sensor_queue_size: 200
  online_sensor_max_lag_sec: 0.5
  online_sensor_resume_lag_sec: 0.1
  online_lidar_loc_queue_size: 1
  enable_lidar_loc_skip: false
  localization_output_max_lidar_age_sec: 0.5
  enable_imu_static_hold: true
  enable_wheel_speed_observation: true
  wheel_speed_topic: /SpeThrCAN4_topic
  # Filled from calibrations.yaml by resolve_sany_config.py using VIN (m/s per rpm).
  enable_wheel_speed_dr_observation: true
  wheel_speed_dr_base_std_mps: 0.35
  wheel_speed_dr_stationary_std_mps: 0.08
  wheel_speed_dr_stationary_threshold_mps: 0.03
  wheel_speed_dr_max_age_sec: 0.25
  wheel_speed_dr_future_tolerance_sec: 0.0
  wheel_speed_dr_max_acceleration_mps2: 4.0
  wheel_speed_dr_max_abs_innovation_mps: 1.5
  wheel_speed_dr_nis_gate: 9.0
  wheel_speed_dr_torque_reference_nm: 1000.0
  wheel_speed_dr_torque_std_scale: 3.0
  wheel_speed_dr_max_velocity_step_mps: 0.35
  lidar_qos:
    reliability: reliable
    depth: 16
  online_lidar_input_max_timestamp_lag_sec: 0.0
backend:
  mode: ba_btc_hba
  verbose: true
  local_ba:
    enabled: false
  btc:
    enabled: true
    descriptor_submap_size: 10
    descriptor_submap_stride: 2
    max_points_per_submap: 50000
    min_points_per_submap: 100
    downsample_leaf_size: 0.2
    refine_with_icp: true
    icp_max_iterations: 30
    icp_max_correspondence_distance: 5.0
    icp_max_fitness_score: 2.0
    icp_max_translation_correction: 10.0
    icp_batch_size: 8
    icp_workers: 8
    min_loop_score: 0.6
    max_drift_ratio: 0.005
    max_rotation_correction_deg: 45.0
    refine_with_plane_icp: true
    plane_icp_iterations: 20
    plane_icp_min_matches: 20
    plane_icp_min_observability: 3.0
    allow_degenerate_plane_icp: true
    degenerate_min_loop_score: 0.6
    degenerate_min_matches: 60
    confirmation_count: 2
    confirmation_max_current_gap: 10
    confirmation_max_history_gap: 10
    loop_cooldown_descriptors: 10
    max_odom_revisit_distance: 0.0
    min_optimization_translation: 0.2
    min_optimization_rotation_deg: 2.0
    descriptor:
      useful_corner_num: 200
      plane_merge_normal_threshold: 0.1
      plane_merge_distance_threshold: 0.3
      plane_detection_threshold: 0.01
      voxel_size: 1.0
      voxel_init_points: 10
      projection_plane_count: 2
      projection_resolution: 0.5
      projection_height_increment: 0.1
      projection_min_distance: 0.0
      projection_max_distance: 5.0
      summary_min_threshold: 10.0
      line_filter: 1
      touch_filter: 0
      descriptor_near_count: 15
      descriptor_min_length: 2.0
      descriptor_max_length: 50.0
      non_max_suppression_radius: 2.0
      triangle_side_resolution: 0.2
      skip_near_descriptors: 30
      candidate_count: 50
      verification_threads: 4
      rough_distance_threshold: 0.03
      similarity_threshold: 0.5
      internal_icp_threshold: 0.15
      normal_threshold: 0.2
      plane_distance_threshold: 0.5
  pose_graph:
    iterations: 20
    outlier_iterations: 10
    motion_translation_noise: 0.1
    motion_rotation_noise_deg: 3.0
    loop_translation_noise: 0.2
    loop_rotation_noise_deg: 3.0
    robust_kernel_delta: 1.0
    loop_outlier_chi2: 25.0
  hba:
    enabled: false
loop_closing:
  with_height: false
diagnostics:
  # Independent matching evidence; protected packages are never evicted to make
  # room for new ones. A full archive reports skipped captures instead.
  match_failure_capture:
    enabled: true
    cooldown_seconds: 30.0  # Legacy key; continuous failures now use a three-package episode limit.
    recovery_seconds: 2.0
    max_scan_points: 50000
    event_mb: 64
    disk_mb: 1024
    min_free_mb: 2048
    protect_days: 7
    write_mb_per_second: 10.0
  incident_capture:
    enabled: true
    pre_seconds: 30.0
    post_seconds: 10.0
    max_event_seconds: 60.0
    memory_mb: 2048
    max_message_mb: 64
    event_mb: 2048
    disk_mb: 8192
    min_free_mb: 2048
    segment_mb: 32
    max_events: 10
    write_mb_per_second: 20.0
    startup_timeout_seconds: 8.0
    output_timeout_seconds: 0.5
    input_timeout_seconds: 0.5
    cooldown_seconds: 10.0
  # Bench defaults. Freeze config_version after coverage/false-alarm calibration.
  config_version: localization-dtc-v5-confirmed-loss
  safety_topic: /safety/throstle
  # false: always publish normal Safety.runstate=0; source DTC reporting is unchanged.
  safety_fault_reporting_enabled: true
  # Retain strict and unrestricted shadow results for audit.
  # Only the separately approved bounded policy below can affect actual Safety.
  radar_time_sync_shadow_enabled: true
  # Active only with fresh driver v3 proof: advancing PTP, <=1 ms,
  # no detected clock discontinuity, warning-only allowlist and healthy localization.
  radar_bounded_sync_warning_enabled: true
  # Explicit override of runstate=2 only, including unknown/stale radar evidence.
  # Native DTCs, localization runstate=4 and severe/all-lidar-failed -9 remain active.
  radar_fault_mask_enabled: false
  radar_role_source_ids: [7, 12, 8, 9]  # front, rear, left, right
  radar_snapshot_timeout_sec: 0.5
  radar_hms_timeout_sec: 2.5
  motion_window_sec: 0.5
  max_input_gap_sec: 0.1
  longitudinal_tolerance_m: 0.5
  lateral_tolerance_m: 0.3
  yaw_tolerance_deg: 2.0
  distance_tolerance_ratio: 0.1
  angle_tolerance_ratio: 0.1
  major_sigma_limit_m: 0.5
  # 2026-10-27 commissioning: relax uncertainty-only stops. Recorded peaks on
  # Oct 26-27 were 0.344 m lateral and 4.325 deg yaw; motion checks stay separate.
  lateral_sigma_limit_m: 0.5
  yaw_sigma_limit_deg: 5.0
  # PGO already includes factor noise, DR process noise and output offsets.
  # Additional inflation requires calibration; 4x failed healthy PGO posteriors.
  covariance_variance_scale: 1.0
  position_sigma_floor_m: 0.1
  angle_sigma_floor_deg: 0.5
  # Output/match staleness alone stops with 4; confirmed localization loss is -9.
  output_timeout_sec: 0.5
  # The quality result belongs to that output; expire both at the same age.
  evaluation_timeout_sec: 0.5
  # TOTAL steady age of prior passing required yaw evidence; CAN is optional.
  # This is not extra time after
  # max_input_gap_sec. 150 ms is a commissioning candidate from the 2026-10-21
  # stationary load capture; validate under driving load before acceptance.
  # UNKNOWN cannot renew this deadline or override a confirmed failure/-9.
  consistency_unknown_grace_sec: 0.15
  startup_grace_sec: 8.0
  max_speed_mps: 30.0
  max_yaw_rate_radps: 3.0
localization_pgo:
  covariance_position_noise_m_sqrt_sec: 0.2
  covariance_angle_noise_deg_sqrt_sec: 2.0
  enable_dr_extrapolation: true
  enable_dr_smoothing: true
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: false
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 0.0
  filter_z_max: 100.0
  filter_z_min: -100.0
  force_2d: false
  grid_search_angle_range: 20.0
  grid_search_angle_step: 20
  lidar_loc_odom_th: 1.0
  init_with_fp: false
  min_init_confidence: 0.5
  min_tracking_confidence: 0.4
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: false
  try_self_extrap: false
relocalization:
  enabled: true
  backend: solid_kiss
  refinement_backend: plane_icp
  plane_icp:
