    fine_max_correspondence_distance: 0.75
    huber_delta: 0.2
    max_rmse: 0.12
    coarse_max_iterations: 10
    fine_max_iterations: 15
    min_matches: 500
    min_inlier_ratio: 0.3
    translation_convergence: 0.005
    rotation_convergence_deg: 0.05
    min_normalized_hessian_eigenvalue: 0.0001
    max_hessian_condition_number: 100000.0
    max_translation_correction: 2.0
    max_rotation_correction_deg: 10.0
  database_subdirectory: btc_relocalization
  lost_frame_threshold: 5
  query_submap_sizes:
  - 5
  - 10
  - 20
  query_stride: 1
  top_k: 10
  candidate_dedup_radius: 2.0
  candidate_dedup_yaw_deg: 15.0
  max_points_per_submap: 50000
  min_points_per_submap: 100
  downsample_leaf_size: 0.2
  min_btc_score: 0.16
  enable_map_consistency: true
  validation_workers: 2
  map_bounds_margin: 0.5
  map_nearest_neighbor_distance: 0.5
  map_min_inside_xy_ratio: 0.9
  map_precheck_min_overlap_ratio: 0.85
  map_min_overlap_ratio: 0.92
  map_min_gravity_alignment_cos: 0.95
  map_consistency_max_points: 50000
  confirmation_count: 2
  confirmation_max_translation: 1.0
  confirmation_max_rotation_deg: 5.0
  confirmation_max_interval: 1.0
  kiss_matcher:
    map_precheck_min_overlap_ratio: 0.55
    map_min_overlap_ratio: 0.75
    query_submap_sizes:
    - 1
    - 3
    query_stride: 3
    max_points_per_submap: 50000
    min_points_per_submap: 500
    voxel_size: 0.5
    normal_radius: 1.75
    feature_radius: 2.5
    descriptor_ratio: 0.9
    max_feature_points: 60000
    max_correspondences: 800
    compatibility_tolerance: 1.0
    minimum_pair_distance: 1.0
    minimum_core_degree: 4
    minimum_inliers: 12
    inlier_threshold: 0.75
    maximum_rmse: 0.5
    gnc_max_iterations: 50
    gnc_factor: 1.4
    spatial_cell_size: 5.0
    minimum_spatial_cells: 4
    feature_threads: 8
  solid_kiss:
    map_precheck_min_overlap_ratio: 0.55
    map_min_overlap_ratio: 0.75
    map_precheck_max_points: 5000
    max_refinement_candidates: 1
    top_k: 8
    retrieval_pool_size: 64
    candidate_batch_size: 8
    plane_icp:
      coarse_max_correspondence_distance: 2.5
      coarse_max_iterations: 25
      fine_max_iterations: 20
      max_translation_correction: 3.0
      max_rmse: 0.25
  solid:
    database_subdirectory: solid_relocalization
    source_database_subdirectory: btc_relocalization
    compute_backend: cpu
    query_submap_sizes:
    - 1
    - 3
    - 5
    - 10
    query_stride: 1
    top_k: 128
    retrieval_pool_size: 200
    min_similarity: 0.55
    candidate_dedup_radius: 2.0
    candidate_dedup_yaw_deg: 15.0
    max_points_per_submap: 50000
    min_points_per_submap: 100
    downsample_leaf_size: 0.2
    refine_with_icp: true
    icp_max_iterations: 30
    icp_max_correspondence_distance: 5.0
    icp_max_fitness_score: 2.0
    icp_max_translation_correction: 10.0
    icp_batch_size: 8
    icp_yaw_hypothesis_offsets_deg:
    - 0.0
    - 90.0
    - -90.0
    - 180.0
    debug_candidate_ids: []
    descriptor:
      range_bins: 40
      angle_bins: 60
      elevation_bins: 32
      min_distance: 3.0
      max_distance: 80.0
      elevation_min_deg: -90.0
      elevation_max_deg: 90.0
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
