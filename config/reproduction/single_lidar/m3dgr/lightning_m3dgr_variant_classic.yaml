common:
  dataset: "m3dgr"
  lidar_topic: ""
  livox_lidar_topic: "/livox/mid360/lidar"
  imu_topic: "/livox/mid360/imu"

imu_initialization:
  min_duration: 2.0
  min_samples: 300
  max_mean_gyro_norm: 0.2
  max_gyro_std: 0.1
  max_acc_std: 0.5
  min_mean_acc_norm: 0.5
  max_mean_acc_norm: 1.5

lidar_noise_model:
  enabled: true
  range_sigma: 0.02
  angular_sigma_deg: 0.05
  reference_sigma: 0.05
  min_information_scale: 0.25
  max_information_scale: 4.0

output:
  map_frame: "map"
  lidar_frame: "mid360"
  primary_lidar_position_in_body: [0.0, 0.0, 0.0]

fasterlio:
  lidar_type: 1
  scan_line: 4
  blind: 0.5
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 3
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  propagate_velocity: false
  lidar_update_pose_only: false
  lidar_update_inertial_states: true
  max_update_velocity_step: 2.0
  max_update_gyro_bias_step: 0.05
  max_update_acc_bias_step: 0.5
  max_update_gravity_step: 0.05
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]
  keep_first_imu_estimation: false
  kf_dis_th: -1.0
  kf_angle_th: 0.0
  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 300
  imu_filter: false
  proj_kfs: false

roi:
  height_max: 100.0
  height_min: -100.0

system:
  with_ui: false
